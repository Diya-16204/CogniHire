services:
  - type: web
    name: cognihire-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: UPSTASH_REDIS_HOST
        sync: false
      - key: UPSTASH_REDIS_PORT
        value: "6379"
      - key: UPSTASH_REDIS_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INTERVIEW_KAFKA_ENABLED
        value: "false"
      - key: JUDGE0_BASE_URL
        value: ""
      - key: PISTON_ENABLED
        value: "true"
      - key: PISTON_LOCAL_URL
        value: http://localhost:2000
      - key: PISTON_PUBLIC_URL
        value: https://emkc.org/api/v2/piston
      - key: PISTON_API_KEY
        sync: false
