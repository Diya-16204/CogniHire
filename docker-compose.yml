services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cognihire
      POSTGRES_USER: cognihire
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - cognihire-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognihire -d cognihire"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  cognihire-postgres:
