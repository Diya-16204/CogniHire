services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cognihire
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-cognihire}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - cognihire-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognihire -d cognihire"]
      interval: 5s
      timeout: 3s
      retries: 10
  cognihire-redis:
    image: redis:7-alpine
    container_name: cognihire-redis
    ports:
      - "6379:6379"
    volumes:
      - cognihire-redis-data:/data
    restart: unless-stopped
  cognihire-piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: cognihire-piston
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - piston-packages:/piston
    restart: unless-stopped
volumes:
  cognihire-postgres:
  cognihire-redis-data:
  piston-packages:
